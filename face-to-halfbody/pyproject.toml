[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "face-to-halfbody"
version = "0.1.0"
description = "将头像与身体模板合成上半身照片"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.24.0,<2.0.0",
    "insightface>=0.7.3",
    "onnxruntime-gpu>=1.15.0",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
face-to-halfbody = "face_to_halfbody.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["face_to_halfbody*"]

